<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO Deals</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">LEGO <span>Deals</span></div>
    <nav class="nav">
      <a href="/" class="active">Deals</a>
      <a href="/sets.html">All Sets</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Best LEGO deals</h1>
    <p>Sets imported from Brickset with automatic price-drop detection between scrapes.</p>
  </section>

  <div class="stats-bar" id="stats"></div>

  <div class="filters">
    <select id="themeFilter">
      <option value="">All themes</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty hidden" id="empty">No deals yet. Add your API key in Admin and run a scrape.</p>

  <script>
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const themeFilter = document.getElementById('themeFilter');
    const statsEl = document.getElementById('stats');

    function card(set) {
      const badge = set.discountPercent > 0
        ? `<span class="badge">-${set.discountPercent}%</span>`
        : set.isDeal ? `<span class="badge">Deal</span>` : '';

      const original = set.originalPrice > set.currentPrice
        ? `<span class="original">${set.formattedOriginal}</span>`
        : '';

      const image = set.imageUrl
        ? `<img src="${set.imageUrl}" alt="${set.name}" loading="lazy">`
        : '';

      return `
        <article class="card">
          <div class="card-image">${image}${badge}</div>
          <div class="card-body">
            <p class="set-number">${set.setNumber}</p>
            <h3>${set.name}</h3>
            <p class="meta">${set.excerpt || set.theme || ''}</p>
            <div class="prices">
              <span class="current">${set.formattedCurrent}</span>
              ${original}
            </div>
            ${set.bricksetUrl ? `<p class="meta"><a href="${set.bricksetUrl}" target="_blank" rel="noopener">View on Brickset</a></p>` : ''}
          </div>
        </article>
      `;
    }

    async function loadStats() {
      const res = await fetch('/api/stats');
      const data = await res.json();
      statsEl.innerHTML = `
        <div class="stat"><strong>${data.total}</strong><span>sets tracked</span></div>
        <div class="stat"><strong>${data.deals}</strong><span>active deals</span></div>
      `;
      themeFilter.innerHTML = '<option value="">All themes</option>' +
        data.themes.map(t => `<option value="${t.theme}">${t.theme} (${t.count})</option>`).join('');
    }

    async function loadSets() {
      const theme = themeFilter.value;
      const params = new URLSearchParams({ deals: 'true', limit: '48' });
      if (theme) params.set('theme', theme);

      const res = await fetch('/api/sets?' + params);
      const data = await res.json();

      if (!data.sets.length) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = data.sets.map(card).join('');
    }

    themeFilter.addEventListener('change', loadSets);
    loadStats();
    loadSets();
  </script>
</body>
</html>
